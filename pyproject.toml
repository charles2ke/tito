[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tito"
version = "0.1.0"
description = "Together In Together Out (TITO) group scheduling queue"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }

[tool.setuptools]
packages = ["tito"]
